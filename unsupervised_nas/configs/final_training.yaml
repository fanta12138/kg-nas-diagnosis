# 阶段3: 最终训练配置

data:
  data_dir: '../datasets/mvtec_anomaly_detection/wood'
  img_size: 224
  num_workers: 4

# 从NAS搜索结果中获取的最佳架构（将被自动覆盖）
model:
  backbone: 'resnet18'
  feature_dim: 512
  pretrained: true

training:
  epochs: 200
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  save_freq: 10

anomaly_detection:
  method: 'reconstruction'
  threshold_method: 'percentile'
  threshold_percentile: 95

output:
  dir: 'experiments/final'
