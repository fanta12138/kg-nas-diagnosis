best_architecture:
  backbone: efficientnet_b0
  feature_dim: 128
search_config:
  data:
    data_dir: ../datasets/mvtec_anomaly_detection/wood
    img_size: 224
    num_workers: 4
  nas:
    alpha: 0.5
    batch_size: 16
    beta: 0.3
    gamma: 0.2
    num_trials: 30
    quick_train_epochs: 3
    search_space:
      backbones:
      - convnextv2_tiny
      - convnextv2_small
      - efficientnetv2_s
      - efficientnetv2_m
      - mobileone_s4
      - convnext_tiny
      - efficientnet_b0
      feature_dims:
      - 128
      - 256
      - 512
  output:
    dir: experiments/stage2
  teacher:
    model_path: experiments/stage1/best_teacher.pth
