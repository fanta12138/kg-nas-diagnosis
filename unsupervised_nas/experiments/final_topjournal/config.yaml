anomaly_detection:
  method: reconstruction
  threshold_method: percentile
  threshold_percentile: 95
data:
  data_dir: ../datasets/mvtec_anomaly_detection/wood
  img_size: 224
  num_workers: 4
model:
  backbone: efficientnet_b0
  feature_dim: 256
  pretrained: true
output:
  dir: experiments/final
training:
  batch_size: 32
  epochs: 100
  lr: 0.001
  save_freq: 10
  weight_decay: 0.0001
